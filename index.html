
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toprak Şaka</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: radial-gradient(circle, #40101e, #090910 75%);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
.panel {
  width: min(100%, 520px);
  padding: 45px 25px;
  border: 1px solid #ffffff25;
  border-radius: 25px;
  background: #15111ddd;
  box-shadow: 0 20px 70px #0009;
}
.logo { font-size: 45px; }
h1 { font-size: 38px; }
p { color: #c9bdc8; }
.status {
  display: inline-block;
  padding: 12px 18px;
  border-radius: 30px;
  background: #ffffff12;
}
.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #f4b942;
  margin-right: 8px;
}
#message { display: none; }
#message h2 {
  color: #ff526d;
  font-size: clamp(35px, 9vw, 58px);
}
</style>
</head>
<body>
<main class="panel">
  <div class="logo">😎</div>
  <section id="waiting">
    <h1>Toprak Şaka</h1>
    <p>Şaka bağlantısı açık. Bir mesaj bekleniyor...</p>
    <div class="status"><span class="dot"></span>Bağlantı bekleniyor</div>
  </section>
  <section id="message">
    <h2>NEDEN BENİ<br>DİNLEMEDİN?</h2>
    <p>😏 Yakalandın!</p>
  </section>
</main>
<script>
function showPrank() {
  document.getElementById("waiting").style.display = "none";
  document.getElementById("message").style.display = "block";

  setTimeout(() => {
    document.getElementById("message").style.display = "none";
    document.getElementById("waiting").style.display = "block";
  }, 10000);
}
</script>
</body>
</html>
